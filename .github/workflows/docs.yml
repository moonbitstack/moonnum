name: Docs

# The site in `docs/` is published to GitHub Pages. The only thing built here is
# the playground engine: `src/examples/browser` compiled to JavaScript into
# `docs/engine/`, which is ignored by git and therefore has to be made on every
# publish. The API reference is checked against the interface before upload.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: the API reference matches the interface
        run: |
          moon update
          moon info --target all
          python3 scripts/gen_api.py
          git diff --exit-code -- docs/api.html src/pkg.generated.mbti

      - name: the site names only what exists
        run: python3 scripts/check_docs.py

      # The playground calls into the library, so the page that ships is a build
      # of the same source this commit holds.
      - name: build the playground engine
        run: |
          moon build --target js --release
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/number.js

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
