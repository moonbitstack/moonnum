name: Docs

# The site in `docs/` is published to GitHub Pages. Nothing is built: the pages
# are hand-written HTML and the API reference is generated from the module
# interface, so the step below only checks that the checked-in reference still
# matches the code before uploading.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: the API reference matches the interface
        run: |
          moon update
          moon info --target all
          python3 scripts/gen_api.py
          git diff --exit-code -- docs/api.html src/pkg.generated.mbti

      - name: the site names only what exists
        run: python3 scripts/check_docs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
